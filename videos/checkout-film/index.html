<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><title>Proofline — Checkout walkthrough</title><script src="assets/gsap.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#151b18}#root{position:relative;width:100%;height:100%}.clip{position:absolute;inset:0;overflow:hidden}.clip img{width:100%;height:100%;object-fit:contain;display:block}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="120" data-width="1280" data-height="720">
<section id="change" class="clip" data-start="0" data-duration="20" data-track-index="0"><img src="assets/01-change.jpg" alt="Pricing refactor breaks checkout; actual saved result"></section>
<section id="investigation" class="clip" data-start="20" data-duration="20" data-track-index="0"><img src="assets/02-investigation.jpg" alt="Indexed caller graph and source"></section>
<section id="evidence" class="clip" data-start="40" data-duration="20" data-track-index="0"><img src="assets/03-evidence.jpg" alt="Source-grounded observations"></section>
<section id="repair" class="clip" data-start="60" data-duration="20" data-track-index="0"><img src="assets/04-repair.jpg" alt="Actual model-generated patch"></section>
<section id="execution" class="clip" data-start="80" data-duration="20" data-track-index="0"><img src="assets/05-execution.jpg" alt="Same checkout oracle passes before change, fails on change, passes with repair"></section>
<section id="system" class="clip" data-start="100" data-duration="20" data-track-index="0"><img src="assets/06-system.jpg" alt="Implemented architecture and safeguards"></section>
</div><script>const tl=gsap.timeline({paused:true});['change','investigation','evidence','repair','execution','system'].forEach((id,i)=>{tl.fromTo('#'+id+' img',{opacity:.65},{opacity:1,duration:.35,ease:'power2.out'},i*20);});window.__timelines['main']=tl;</script></body></html>
